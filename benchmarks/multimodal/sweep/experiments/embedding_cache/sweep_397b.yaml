# Qwen3.5-397B vllm-serve sweep: 8K ISL, 5x 2400x1080 images, 1K OSL, rate=4.
# NVTX + MM_CACHE_PROBE env gates on — captures mm:hash:* ranges for perf analysis.

model: Qwen/Qwen3.5-397B-A17B-FP8
request_rates: [4]
osl: 1024
request_count: 100
warmup_count: 5
port: 8000
timeout: 2400
output_dir: /dynamo-tmp/logs/04-21/sweep_397b_rate4_vllm_v13
restart_server_every_benchmark: true
skip_plots: true

env:
  VLLM_MM_CACHE_PROBE: "1"
  VLLM_NVTX_SCOPES_FOR_PROFILING: "1"
  TRANSFORMERS_MM_PROFILING: "1"
  DYN_NVTX: "1"

input_files:
  - /dynamo-tmp/data/10u_10t_5w_8000word_base64.jsonl

configs:
  - label: vllm-serve
    workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
    extra_args:
      - --tensor-parallel-size
      - "8"
      - --enable-expert-parallel
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "60"
      - --enable-prefix-caching
      - --max-model-len
      - "32768"
